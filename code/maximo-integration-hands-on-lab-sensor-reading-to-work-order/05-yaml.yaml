apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: demo.pump.alerts
  namespace: strimzi
  labels:
    strimzi.io/cluster: maskafka      # which Kafka cluster owns the topic
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 86400000            # keep messages for one day
