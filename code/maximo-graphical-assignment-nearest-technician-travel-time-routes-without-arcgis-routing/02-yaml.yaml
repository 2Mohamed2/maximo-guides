# Self-hosted road routing for Maximo (no ArcGIS Online routing licence).
#   osrm         - OSRM car router on the OpenStreetMap GCC extract (Saudi Arabia + Gulf)
#   esri-adapter - answers Maximo's Esri route / OD-matrix / GP-job calls from OSRM
# Apply:  oc apply -f gis-routing.yaml
#         oc -n gis-routing create configmap esri-adapter --from-file=esri_osrm_adapter.py=../adapter/esri_osrm_adapter.py
apiVersion: v1
kind: Namespace
metadata:
  name: gis-routing
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osrm-data
  namespace: gis-routing
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm
  namespace: gis-routing
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: osrm}
  template:
    metadata:
      labels: {app: osrm}
    spec:
      initContainers:
        - name: download
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd /data
              if [ ! -s region.osm.pbf ]; then
                echo "downloading $PBF_URL"
                curl -fSL --retry 5 -o region.osm.pbf.part "$PBF_URL"
                mv region.osm.pbf.part region.osm.pbf
              fi
              ls -la /data
          env:
            - {name: PBF_URL, value: "https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf"}
          volumeMounts: [{name: data, mountPath: /data}]
        - name: build
          image: ghcr.io/project-osrm/osrm-backend:v5.27.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd /data
              if [ ! -s region.osrm.mldgr ]; then
                osrm-extract -p /opt/car.lua region.osm.pbf
                osrm-partition region.osrm
                osrm-customize region.osrm
              fi
              echo built
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {cpu: "8", memory: 16Gi}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: osrm
          image: ghcr.io/project-osrm/osrm-backend:v5.27.1
          command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "10000", "/data/region.osrm"]
          ports: [{containerPort: 5000}]
          readinessProbe:
            tcpSocket: {port: 5000}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: osrm-data}
---
apiVersion: v1
kind: Service
metadata:
  name: osrm
  namespace: gis-routing
spec:
  selector: {app: osrm}
  ports: [{port: 5000, targetPort: 5000}]
